name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate launcher syntax
        run: bash -n goose-sandbox

      - name: Check executable bit
        run: test -x goose-sandbox

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: ShellCheck
        run: shellcheck goose-sandbox

      # Install bats-core and run the test suite (see tests/README.md for the
      # coverage map and how to add tests).
      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run bats test suite
        run: bats tests/

      - name: Build base image
        run: docker build -t goose-agent .

      - name: Build recipe image (c)
        run: docker build -f recipes/c.dockerfile -t goose-agent-c:ci .
